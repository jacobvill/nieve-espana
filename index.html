<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nieve en Europa</title>
<meta name="description" content="Nieve caída, temperatura y previsión en las estaciones de esquí de los Pirineos y los Alpes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f7;--card:#fff;--ink:#0f2233;--muted:#586d7d;--line:#d3dfe8;--accent:#0a6fb7;--snow:#1b8fe0;--fc:#a5d3f6;--cold:#2b6cb0;--warm:#c2511f;--disp:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b1620;--card:#13222e;--ink:#e7f0f6;--muted:#8fa4b3;--line:#233746;--accent:#5db4f0;--snow:#58b4f5;--fc:#2d5f85;--cold:#6fb0f0;--warm:#f0905f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:var(--disp);margin:0}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,#0a1b30 0%,#15406c 52%,#86b4dc 100%)}
.rd{position:absolute;left:-60px;width:calc(100% + 120px);bottom:-1px;height:210px;pointer-events:none}
.r1{fill:#4a79a6;opacity:.55;transform:translateX(calc(var(--mx,0)*-14px))}
.r2{fill:#2a5683;transform:translateX(calc(var(--mx,0)*-30px))}
.r3{fill:var(--bg);transform:translateX(calc(var(--mx,0)*-48px))}
@media (prefers-reduced-motion:reduce){.rd path{transform:none!important}}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;max-width:1560px;margin:0 auto;padding:clamp(36px,7vw,76px) clamp(16px,4vw,56px) 120px}
h1{font-size:clamp(3rem,8vw,5.2rem);line-height:.95;font-weight:700}
.sub{margin:8px 0 0;color:var(--muted)}
.hero .sub{color:rgba(255,255,255,.8)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:28px;max-width:980px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:12px;padding:12px 16px}
.stat b{display:block;font:700 2.4rem/1 var(--disp)}
.stat span{font-size:.9rem;color:rgba(255,255,255,.82)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1560px;margin:-40px auto 0;position:relative;padding:0 clamp(16px,4vw,56px) 64px}
@media (min-width:960px){.wrap{grid-template-columns:250px minmax(0,1fr)}.side{position:sticky;top:16px;align-self:start}}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.side h2{font-size:1.3rem;margin-bottom:10px}
.side form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (min-width:960px){.side form{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
input,select,.btn{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
select{padding-right:30px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238a9ba8' stroke-width='1.6'/></svg>");background-repeat:no-repeat;background-position:right 11px center}
.btn{cursor:pointer;width:auto}
.btn:hover{border-color:var(--accent)}
:is(input,select,.btn,.card,.fav,.go):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cuenta{margin:4px 0 12px;color:var(--muted);font-size:.9rem}
.reg{display:flex;align-items:center;gap:12px;font-size:1.7rem;font-weight:600;margin:22px 0 12px}
.reg:first-child{margin-top:0}
.reg::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(10,40,70,.14)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:1.55rem;font-weight:600;line-height:1.1}
.rg{margin:5px 0 0;color:var(--muted);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{padding:1px 8px;border-radius:20px;font-size:.75rem;font-weight:600}
.chip.n{background:var(--snow);color:var(--card)}
.chip.f{background:var(--fc);color:#0f2233}
.chip.z{background:var(--line);color:var(--muted)}
.temp{font:600 2.2rem/1 var(--disp)}
.cold{color:var(--cold)}
.warm{color:var(--warm)}
.nums{display:flex;gap:20px;margin:12px 0 10px}
.nums b{display:block;font:600 2rem/1 var(--disp)}
.nums span{font-size:.78rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:2px;height:44px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--snow);border-radius:1px 1px 0 0}
.bars i.f{background:var(--fc)}
.bars i.z{background:var(--line)}
.bars i.t{margin-left:5px}
.foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.alt{flex:1;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.trk{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative}
.trk b{position:absolute;top:0;height:4px;border-radius:2px;background:var(--accent)}
.altd{margin:16px 0 4px}
.altl{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.altl b{color:var(--ink);font-weight:600}
.trk.big,.trk.big b{height:8px;border-radius:4px}
.trk.big{margin-top:8px}
.trk i{position:absolute;top:-4px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.fav{all:unset;cursor:pointer;font-size:1.3rem;line-height:1;color:var(--muted);padding:2px 4px}
.fav.on{color:var(--accent)}
.nodata,.vacio{color:var(--muted);margin:14px 0 0}
[hidden]{display:none!important}
@media (prefers-color-scheme:dark){.osm{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.85) saturate(.6)}.topo{filter:brightness(.8)}}
.tools{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:9px 16px;color:var(--muted);background:var(--card)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--card);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#cm select{width:auto;min-height:38px}
#mapa{height:min(72vh,720px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#mleg{margin-top:10px}
.temp .ic{font-size:1.5rem;margin-right:4px;vertical-align:2px}
.fc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(104px,1fr);gap:8px;overflow-x:auto;margin:14px 0 4px}
.fc div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--muted)}
.fc b{font:600 1.15rem var(--disp);color:var(--ink);text-transform:capitalize}
.fc .ic{font-size:1.5rem;line-height:1.2}
.mt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.mt .btn{min-height:38px;padding:6px 14px}
.tools .share{margin-left:auto}
.mc b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#0a6fb7;color:#fff;border:2px solid #fff;font:600 14px Barlow,system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-control-layers label{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:13px;color:#222}
.leaflet-control-layers input{width:auto;min-height:0;padding:0;margin:0}
.days{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px}
.days button{all:unset;cursor:pointer;min-width:46px;text-align:center;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);display:flex;flex-direction:column;font-size:.72rem}
.days button b{font:600 1.1rem var(--disp);color:var(--ink)}
.days button.past{opacity:.6}
.days button.today{border-color:var(--accent)}
.days button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--card);opacity:1}
.days button[aria-pressed=true] b{color:var(--card)}
.days button:focus-visible,.cmpb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lg i.grad{width:160px;height:10px;border-radius:5px;margin:0 6px;vertical-align:middle}
.wxi .wx{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid #fff;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.chip.i{background:var(--ink);color:var(--card)}
.cmpb{all:unset;cursor:pointer;font-size:1.15rem;line-height:1;color:var(--muted);padding:2px 4px}
.cmpb.on{color:var(--accent);font-weight:700}
.camd{font-size:1rem}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.cbar .btn{min-height:36px;padding:4px 12px}
.ct{width:100%;border-collapse:collapse;font-size:.9rem;margin:10px 0}
.ct th,.ct td{padding:6px 8px;text-align:right;border-top:1px solid var(--line)}
.ct th:first-child{text-align:left;color:var(--muted);font-weight:400}
.ct thead th{border-top:0;font:600 1.1rem var(--disp)}
#cmpd h3{font-size:1.2rem;margin:14px 0 0}
.sc{margin:16px 0 4px}
.scl{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;color:var(--muted)}
.scl b{font:700 1.8rem var(--disp);color:var(--ink)}
.scr{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:.85rem;color:var(--muted);margin:6px 0}
.cams{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;color:var(--muted);font-size:.85rem}
.cams a{display:inline-flex;align-items:center;text-decoration:none;min-height:36px;padding:4px 12px}
.hero2{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;margin:16px 0 8px}
.nowb{display:flex;align-items:center;gap:14px}
.nowb .bi{font-size:3.2rem;line-height:1}
.nowb b{display:block;font:700 3rem/1 var(--disp)}
.nowb span{display:block;font-size:.85rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;flex:1;min-width:280px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kpi b{display:block;font:700 1.6rem/1.1 var(--disp)}
.kpi span{font-size:.78rem;color:var(--muted)}
.summ{margin:10px 0 4px}
.summ b{display:block;font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.summ p{margin:2px 0 10px;font-size:1.02rem}
.sec{font-size:1.3rem;font-weight:600;margin:20px 0 6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px 32px}
.ftw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.ft{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.ft th,.ft td{padding:6px 8px;text-align:center;border-top:1px solid var(--line);font-size:.88rem}
.ft thead th{border-top:0;font-weight:400;color:var(--muted);font-size:.78rem}
.ft thead th b{display:block;font:600 1.15rem var(--disp);color:var(--ink)}
.ft tbody th{text-align:left;color:var(--muted);font-weight:500;position:sticky;left:0;background:var(--card);white-space:nowrap;z-index:1}
.ft td small{display:block;color:var(--muted);font-size:.72rem}
.ft td b{font-weight:600}
.ft .ic{font-size:1.4rem;line-height:1.1;display:block}
.ft .we{background:rgba(120,150,180,.1)}
.ft .td{box-shadow:inset 0 -2px 0 var(--accent)}
.ft.hidepast .past{display:none}
.tg{display:inline-block;font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:10px;margin:1px;white-space:nowrap;color:#fff}
.tg.p{background:#1b78c4}
.tg.g{background:#2a9d6f}
.tg.w{background:#8a4fb0}
.tg.h{background:#d9692f}
.fttools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 0;flex-wrap:wrap}
.fttools .btn{min-height:34px;padding:4px 12px;font-size:.85rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;color:var(--muted);border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible,.alts button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ptool{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:14px 0 0}
.ht th,.ht td{padding:4px 5px;font-size:.78rem;min-width:40px}
.ht tbody th{min-width:110px}
.ht td b{display:inline}
.ht td small{display:block;font-size:.66rem}
.camg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:8px 0}
.camc{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-decoration:none;color:var(--ink)}
.camc:hover{border-color:var(--accent)}
.camc span{font-size:1.6rem}
.camc small{color:var(--muted)}
.hp{fill:none;stroke:var(--muted);stroke-opacity:.35;stroke-width:1}
.ha{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.hc{fill:none;stroke:var(--ink);stroke-width:3}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(940px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,15,25,.6)}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
.in{padding:20px 22px 22px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:2.4rem;font-weight:700;line-height:1.05}
.dh .acts{display:flex;gap:6px}
.in .nums b{font-size:2.6rem}
svg.ch{width:100%;height:auto;display:block;margin:6px 0}
.ax{fill:var(--muted);font:11px Barlow,system-ui,sans-serif}
.gl{stroke:var(--line)}
.cut{stroke:var(--line);stroke-dasharray:2 4}
.z0{stroke:var(--muted);stroke-dasharray:3 3}
.lh,.ll{fill:none;stroke-width:2}
.lh{stroke:var(--warm)}
.ll{stroke:var(--cold)}
.dh1{fill:var(--warm)}
.dl1{fill:var(--cold)}
.b{fill:var(--snow)}
.b.f{fill:var(--fc)}
.b.z{fill:var(--line)}
.lg{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.note{color:var(--muted);font-size:.85rem;margin:14px 0 0;max-width:62ch}
.go{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:8px;background:var(--accent);color:var(--card);font-weight:600;text-decoration:none}
footer{grid-column:1/-1;color:var(--muted);font-size:.85rem;max-width:72ch}
a{text-underline-offset:3px}
</style>
</head>
<body>
<header class="hero" id="hero">
<svg class="rd" viewBox="0 0 1440 210" preserveAspectRatio="none" aria-hidden="true"><path class="r1" d="M0 150L90 110L170 140L260 80L350 135L450 95L540 145L640 70L740 130L830 100L930 150L1030 85L1130 140L1230 105L1330 145L1440 100V210H0Z"/></svg>
<svg class="rd" viewBox="0 0 1440 210" preserveAspectRatio="none" aria-hidden="true"><path class="r2" d="M0 185L110 140L200 172L310 120L420 178L520 150L630 186L740 135L850 182L960 145L1070 188L1180 140L1290 184L1440 150V210H0Z"/></svg>
<svg class="rd" viewBox="0 0 1440 210" preserveAspectRatio="none" aria-hidden="true"><path class="r3" d="M0 205L140 188L300 204L470 186L640 206L820 190L1000 206L1180 188L1340 205L1440 194V210H0Z"/></svg>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="hero-in">
<h1>Nieve en Europa</h1>
<p class="sub" id="estado">Cargando datos…</p>
<section class="stats" id="stats"></section>
</div>
</header>
<div class="wrap">
<aside class="side">
<h2>Filtros</h2>
<form onsubmit="return false">
<label>Buscar<input id="q" type="search" placeholder="Nombre de la estación" autocomplete="off"></label>
<label>País, región o estación<select id="region"></select></label>
<label>Cota máxima<select id="cota"><option value="0">Cualquiera</option><option value="2000">Más de 2.000 m</option><option value="2500">Más de 2.500 m</option><option value="3000">Más de 3.000 m</option><option value="3500">Más de 3.500 m</option></select></label>
<label>Nieve<select id="nieve"><option value="">Toda</option><option value="p7">Con nieve en 7 días</option><option value="f5">Con nieve prevista</option><option value="any">Reciente o prevista</option></select></label>
<label>Mostrar<select id="mostrar"><option value="">Todas</option><option value="fav">Solo favoritas</option><option value="cam">Con webcams</option></select></label>
<label>Ordenar por<select id="orden"><option value="region">Región</option><option value="nombre">Nombre</option><option value="p7">Más nieve caída</option><option value="f5">Más nieve prevista</option><option value="frio">Más frío ahora</option><option value="cota">Cota máxima</option><option value="idx">Mejor este finde</option><option value="cerca">Más cerca de mí</option></select></label>
<label>Distancia desde ti (en línea recta)<select id="dist"><option value="0">Cualquiera</option><option value="100">Hasta 100 km</option><option value="250">Hasta 250 km</option><option value="500">Hasta 500 km</option><option value="1000">Hasta 1.000 km</option></select></label>
<button class="btn" id="geo" type="button">Usar mi ubicación</button>
<button class="btn" id="reset" type="button">Limpiar filtros</button>
</form>
</aside>
<section>
<div class="tools">
<div class="seg" role="group" aria-label="Vista"><button type="button" id="vc" aria-pressed="true">Tarjetas</button><button type="button" id="vm" aria-pressed="false">Mapa</button></div>
<label id="cm" hidden>Capa<select id="cmsel"><option value="snow">Nieve del día</option><option value="tmax">Temperatura máxima</option><option value="wind">Viento máximo</option><option value="sun">Horas de sol</option><option value="code">Tiempo</option><option value="p7">Nieve últimos 7 días</option><option value="f5">Nieve prevista (suma)</option></select></label>
<button class="btn share" id="share" type="button">Copiar enlace</button>
</div>
<div class="mt" id="mt" hidden>
<button class="btn" id="play" type="button" aria-label="Reproducir">▶</button>
<div class="days" id="days" role="group" aria-label="Día"></div>
</div>
<p id="cuenta"></p>
<div id="lista"></div>
<div id="mapa" hidden></div>
<div class="lg" id="mleg" hidden></div>
</section>
<footer>
Las barras muestran la nieve diaria: 7 días pasados y, en azul claro, hoy y los días siguientes. La nieve y la temperatura se calculan con el modelo meteorológico de Open-Meteo para la altitud media de cada estación. Datos meteorológicos: <a href="https://open-meteo.com/">Open-Meteo.com</a>.
</footer>
</div>
<dialog id="det"><div class="in"></div></dialog>
<dialog id="cmpd"><div class="in"></div></dialog>
<div class="cbar" id="cbar" hidden><span id="cn"></span><button class="btn" id="cgo" type="button">Comparar</button><button class="btn" id="cclr" type="button">Vaciar</button></div>
<script>
const $ = s => document.querySelector(s);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const sum = a => a.reduce((t, d) => t + (d.snow || 0), 0);
const day = (d, o) => new Date(d + 'T12:00:00').toLocaleDateString('es-ES', o);
const PAIS = {ES: 'España', AD: 'Andorra', FR: 'Francia', CH: 'Suiza', AT: 'Austria', IT: 'Italia'};
const DEF = {q: '', region: '', cota: 0, nieve: '', mostrar: '', orden: 'region', dist: 0};
const CMP = {
  nombre: (a, b) => a.name.localeCompare(b.name, 'es'),
  p7: (a, b) => (b.ok ? b.p7 : -1) - (a.ok ? a.p7 : -1),
  f5: (a, b) => (b.ok ? b.f5 : -1) - (a.ok ? a.f5 : -1),
  frio: (a, b) => (a.ok ? a.t : 99) - (b.ok ? b.t : 99),
  cota: (a, b) => b.alt_top - a.alt_top,
  idx: (a, b) => (b.sc ? b.sc.total : -1) - (a.sc ? a.sc.total : -1),
  cerca: (a, b) => (a.km == null ? 1e9 : a.km) - (b.km == null ? 1e9 : b.km)
};
let DATA = [], CUR = [], ID = null, MAX = 10, st = {...DEF}, FAV = new Set();
try { FAV = new Set(JSON.parse(localStorage.getItem('fav') || '[]')); } catch (e) {}
const saveFav = () => { try { localStorage.setItem('fav', JSON.stringify([...FAV])); } catch (e) {} };

function bars(days) {
  return '<div class="bars">' + days.map((d, i) => {
    const c = d.snow || 0;
    const h = c > 0 ? Math.max(3, Math.round(c / MAX * 44)) : 2;
    const cls = [i >= 7 ? 'f' : '', c > 0 ? '' : 'z', i === 7 ? 't' : ''].join(' ').trim();
    return `<i class="${cls}" style="height:${h}px" title="${day(d.date, {day: 'numeric', month: 'short'})}: ${fmt(c)} cm"></i>`;
  }).join('') + '</div>';
}

function card(s, showReg) {
  const tag = !s.ok ? null : s.p7 >= 1 ? ['Nevó', 'n'] : s.f5 >= 1 ? ['Nevará', 'f'] : ['Sin nieve', 'z'];
  const fav = FAV.has(s.id), cam = s.webcams && s.webcams.length ? '<span class="camd" title="Tiene webcams">📷</span>' : '';
  const l = Math.max(0, (s.alt_base - 500) / 34), w = Math.max(4, (s.alt_top - s.alt_base) / 34);
  return `<article class="card" tabindex="0" role="button" data-id="${s.id}" aria-label="${s.name}: ver detalle">` +
    `<div class="top"><div><h3>${s.name}</h3><p class="rg">${tag ? `<span class="chip ${tag[1]}">${tag[0]}</span>` : ''}${st.orden === 'idx' && s.sc ? `<span class="chip i">Finde ${s.sc.total}/100</span>` : ''}${showReg ? s.region : ''}${s.km != null ? `<span>a ${Math.round(s.km)} km</span>` : ''}</p></div>` +
    (s.ok ? `<span class="temp ${s.t > 0 ? 'warm' : 'cold'}">${wi(s)}${s.t}°</span>` : '') + '</div>' +
    (s.ok
      ? `<div class="nums"><div><b>${fmt(s.p7)}</b><span>cm últimos 7 días</span></div><div><b>${fmt(s.f5)}</b><span>cm próx. ${FD} días</span></div></div>${bars(s.days)}`
      : '<p class="nodata">Sin datos hoy</p>') +
    `<div class="foot"><div class="alt"><span>${s.alt_base}</span><div class="trk"><b style="left:${l}%;width:${w}%"></b></div><span>${s.alt_top} m</span></div>` +
    `${cam}<button class="cmpb${CMPS.includes(s.id) ? ' on' : ''}" type="button" aria-pressed="${CMPS.includes(s.id)}" aria-label="Comparar" title="Comparar">⇄</button><button class="fav${fav ? ' on' : ''}" type="button" aria-pressed="${fav}" aria-label="${fav ? 'Quitar de favoritas' : 'Añadir a favoritas'}">${fav ? '★' : '☆'}</button></div></article>`;
}

function render() {
  const q = norm(st.q.trim());
  let f = DATA.filter(s =>
    (!q || norm(s.name).includes(q)) &&
    (!st.region || (st.region[1] === ':' ? (st.region[0] === 'c' ? s.country === st.region.slice(2) : s.id === st.region.slice(2)) : s.region === st.region)) &&
    s.alt_top > st.cota &&
    (st.mostrar === 'fav' ? FAV.has(s.id) : st.mostrar === 'cam' ? !!(s.webcams && s.webcams.length) : true) &&
    (!st.dist || (s.km != null && s.km <= st.dist)) &&
    (!st.nieve || (s.ok && (st.nieve === 'p7' ? s.p7 >= 1 : st.nieve === 'f5' ? s.f5 >= 1 : s.p7 >= 1 || s.f5 >= 1))));
  $('#cuenta').textContent = `Mostrando ${f.length} de ${DATA.length} estaciones`;
  const el = $('#lista');
  if (!f.length) {
    CUR = [];
    el.innerHTML = '<p class="vacio">Ninguna estación coincide con los filtros. <button class="btn" type="button" data-reset>Limpiar filtros</button></p>';
    return;
  }
  if (st.orden === 'region') {
    const rs = [...new Set(f.map(s => s.region))];
    CUR = rs.flatMap(r => f.filter(s => s.region === r));
    el.innerHTML = rs.map(r => `<h2 class="reg">${r}</h2><div class="grid">${f.filter(s => s.region === r).map(s => card(s, false)).join('')}</div>`).join('');
  } else {
    CUR = f.slice().sort(CMP[st.orden]);
    el.innerHTML = `<div class="grid">${CUR.map(s => card(s, true)).join('')}</div>`;
  }
}

function stats() {
  const ok = DATA.filter(s => s.ok);
  if (!ok.length) return;
  const con = ok.filter(s => s.p7 >= 1).length;
  const nv = ok.reduce((a, s) => s.f5 > a.f5 ? s : a, ok[0]);
  const fr = ok.reduce((a, s) => s.t < a.t ? s : a, ok[0]);
  $('#stats').innerHTML =
    `<div class="stat"><b>${con} de ${DATA.length}</b><span>estaciones con nieve en los últimos 7 días</span></div>` +
    (nv.f5 >= 1
      ? `<div class="stat"><b>${fmt(nv.f5)} cm</b><span>de nieve prevista en ${FD} días, el máximo, en ${nv.name}</span></div>`
      : `<div class="stat"><b>0 cm</b><span>sin nevadas previstas en los próximos ${FD} días</span></div>`) +
    `<div class="stat"><b>${fr.t}°</b><span>la temperatura más baja ahora, en ${fr.name}</span></div>`;
}

function chart(days) {
  const W = 640, L = 34, R = 8, B = 232, n = days.length, step = (W - L - R) / n, x = i => L + step * (i + .5);
  const hi = Math.ceil(Math.max(...days.map(d => d.tmax), 0)) + 1;
  const lo = Math.floor(Math.min(...days.map(d => d.tmin), 0)) - 1;
  const ty = t => 24 + (hi - t) / (hi - lo) * 82;
  const sm = Math.max(5, ...days.map(d => d.snow || 0)), sy = c => B - c / sm * 70, bw = step * .6;
  const pts = k => days.map((d, i) => `${x(i).toFixed(1)},${ty(d[k]).toFixed(1)}`).join(' ');
  const cut = L + step * 7;
  let s = `<svg class="ch" viewBox="0 0 ${W} 272" role="img" aria-label="Temperaturas y nieve diaria: 7 días pasados y previsión">`;
  s += `<line class="z0" x1="${L}" x2="${W - R}" y1="${ty(0)}" y2="${ty(0)}"/>`;
  s += [hi, 0, lo].map(v => `<text class="ax" x="${L - 6}" y="${ty(v) + 4}" text-anchor="end">${v}°</text>`).join('');
  s += `<polyline class="lh" points="${pts('tmax')}"/><polyline class="ll" points="${pts('tmin')}"/>`;
  s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${B}" y2="${B}"/><line class="cut" x1="${cut}" x2="${cut}" y1="4" y2="258"/>`;
  s += `<text class="ax" x="${L}" y="12">Últimos 7 días</text><text class="ax" x="${cut + 6}" y="12">Previsión</text>`;
  days.forEach((d, i) => {
    const c = d.snow || 0, f = i >= 7 ? ' f' : '', t = day(d.date, {weekday: 'long', day: 'numeric', month: 'long'});
    s += `<circle class="dh1" cx="${x(i)}" cy="${ty(d.tmax)}" r="3"><title>${t}: máxima ${Math.round(d.tmax)}°</title></circle>`;
    s += `<circle class="dl1" cx="${x(i)}" cy="${ty(d.tmin)}" r="3"><title>${t}: mínima ${Math.round(d.tmin)}°</title></circle>`;
    s += c > 0
      ? `<rect class="b${f}" x="${x(i) - bw / 2}" y="${sy(c)}" width="${bw}" height="${B - sy(c)}"><title>${t}: ${fmt(c)} cm</title></rect>`
      : `<rect class="b z" x="${x(i) - bw / 2}" y="${B - 1.5}" width="${bw}" height="1.5"><title>${t}: sin nieve</title></rect>`;
    if (c >= 0.5) s += `<text class="ax" x="${x(i)}" y="${sy(c) - 4}" text-anchor="middle">${fmt(c)}</text>`;
    s += `<text class="ax" x="${x(i)}" y="250" text-anchor="middle">${day(d.date, {weekday: 'short'})}</text>`;
    s += `<text class="ax" x="${x(i)}" y="264" text-anchor="middle">${day(d.date, {day: 'numeric'})}</text>`;
  });
  return s + '</svg>';
}

function view() { render(); drawMap(); hashSave(); }

const ICON = c => c == null ? '' : c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌧️' : c <= 86 ? '🌨️' : '⛈️';
const wi = s => { const i = s.days[7] ? ICON(s.days[7].code) : ''; return i ? `<span class="ic">${i}</span>` : ''; };

function windNow(s) {
  if (s.wind_now == null) return '';
  return `<div><b>${Math.round(s.wind_now)}</b><span>km/h de viento</span></div>` +
    (s.cloud_now == null ? '' : `<div><b>${Math.round(s.cloud_now)}%</b><span>de nubes</span></div>`);
}

function fcBlock(s) {
  const f = s.days.slice(7);
  if (!f.length || f[0].wind == null) return '';
  return '<div class="fc">' + f.map(d =>
    `<div><b>${day(d.date, {weekday: 'short'})}</b><span class="ic">${ICON(d.code)}</span><span>${Math.round(d.tmin)}° / ${Math.round(d.tmax)}°</span><span>Viento ${Math.round(d.wind)} km/h</span><span>Rachas ${Math.round(d.gust)} km/h</span><span>Sol ${d.sun == null ? '–' : fmt(d.sun)} h</span></div>`).join('') + '</div>';
}

let MAP = null, LAY = null, CM = 'snow', VM = false, LQ = null, DI = 7, FD = 5, TM = null, WI = [], REFD = [], POS = null, CMPS = [];
const SCALE = ['#8aa0b0', '#a5d3f6', '#4aa3e8', '#0a5fa8'];
const dv = (s, k) => s.days[DI] ? s.days[DI][k] : null;
const val = s => !s.ok ? null : CM === 'p7' || CM === 'f5' ? s[CM] : dv(s, CM);
const SNOWC = v => v < 1 ? SCALE[0] : v < 5 ? SCALE[1] : v < 15 ? SCALE[2] : SCALE[3];
const RAMPS = {
  tmax: [[-12, [45, 84, 170]], [-4, [110, 170, 230]], [0, [225, 235, 245]], [5, [250, 200, 120]], [12, [230, 110, 60]], [20, [180, 40, 40]]],
  wind: [[0, [200, 230, 210]], [20, [140, 200, 160]], [40, [240, 200, 90]], [60, [225, 120, 60]], [90, [150, 40, 120]]],
  sun: [[0, [110, 120, 140]], [4, [200, 190, 150]], [8, [250, 210, 80]], [11, [250, 170, 30]]]
};
const ramp = (r, v) => {
  if (v <= r[0][0]) return `rgb(${r[0][1]})`;
  for (let i = 1; i < r.length; i++) {
    if (v <= r[i][0]) {
      const [v0, c0] = r[i - 1], [v1, c1] = r[i], t = (v - v0) / (v1 - v0);
      return `rgb(${c0.map((x, j) => Math.round(x + (c1[j] - x) * t))})`;
    }
  }
  return `rgb(${r[r.length - 1][1]})`;
};
const mcol = s => {
  const v = val(s);
  if (v == null) return SCALE[0];
  if (CM === 'code') return ramp(RAMPS.tmax, dv(s, 'tmax') == null ? 0 : dv(s, 'tmax'));
  return RAMPS[CM] ? ramp(RAMPS[CM], v) : SNOWC(v);
};
const UNITS = {snow: ' cm', p7: ' cm', f5: ' cm', tmax: '°', wind: ' km/h', sun: ' h'};
const WXT = c => c === 0 ? 'despejado' : c <= 2 ? 'poco nuboso' : c === 3 ? 'cubierto' : c <= 48 ? 'niebla' : c <= 57 ? 'llovizna' : c <= 67 ? 'lluvia' : c <= 77 ? 'nieve' : c <= 82 ? 'chubascos' : c <= 86 ? 'chubascos de nieve' : 'tormenta';

function loadJS(src, cb) {
  const j = document.createElement('script');
  j.src = src;
  j.onload = cb;
  document.head.appendChild(j);
}
function loadCss(href) {
  const c = document.createElement('link');
  c.rel = 'stylesheet';
  c.href = href;
  document.head.appendChild(c);
}
function loadLeaflet(cb) {
  if (window.L && L.markerClusterGroup) return cb();
  if (LQ) return LQ.push(cb);
  LQ = [cb];
  const B = 'https://cdnjs.cloudflare.com/ajax/libs/';
  loadCss(B + 'leaflet/1.9.4/leaflet.min.css');
  loadCss(B + 'leaflet.markercluster/1.5.3/MarkerCluster.css');
  loadJS(B + 'leaflet/1.9.4/leaflet.min.js', () => loadJS(B + 'leaflet.markercluster/1.5.3/leaflet.markercluster.js', () => LQ.forEach(f => f())));
}

function legend() {
  const el = $('#mleg');
  if (CM === 'snow' || CM === 'p7' || CM === 'f5') {
    el.innerHTML = [[SCALE[0], 'menos de 1 cm'], [SCALE[1], '1 a 5 cm'], [SCALE[2], '5 a 15 cm'], [SCALE[3], 'más de 15 cm']].map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
    return;
  }
  const k = CM === 'code' ? 'tmax' : CM, r = RAMPS[k], a = r[0][0], b = r[r.length - 1][0], u = k === 'wind' ? ' km/h' : k === 'sun' ? ' h' : '°';
  el.innerHTML = `<span>${a}${u}</span><i class="grad" style="background:linear-gradient(90deg,${r.map(([v, c]) => `rgb(${c}) ${Math.round((v - a) / (b - a) * 100)}%`).join(',')})"></i><span>${b}${u}</span>` +
    (CM === 'code' ? '<span>Icono: tiempo del día. Color: temperatura máxima.</span>' : '');
}

function drawMap(fit = true) {
  if (!VM) return;
  legend();
  loadLeaflet(() => {
    if (!MAP) {
      MAP = L.map('mapa').setView([46, 8], 5);
      const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 14, className: 'osm', attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(MAP);
      const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom: 14, className: 'topo', attribution: '© OpenStreetMap, SRTM | © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'});
      L.control.layers({'Mapa': osm, 'Relieve': topo}, null, {collapsed: false}).addTo(MAP);
      LAY = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false, iconCreateFunction: c => L.divIcon({html: `<b>${c.getChildCount()}</b>`, className: 'mc', iconSize: [34, 34]})}).addTo(MAP);
    }
    MAP.invalidateSize();
    LAY.clearLayers();
    CUR.forEach(s => {
      const v = val(s), ok = v != null;
      const txt = !ok ? 'sin datos' : CM === 'code' ? WXT(v) : fmt(v) + UNITS[CM];
      const mk = CM === 'code' && ok
        ? L.marker([s.lat, s.lon], {icon: L.divIcon({html: `<span class="wx" style="background:${mcol(s)}">${ICON(v)}</span>`, className: 'wxi', iconSize: [30, 30]})})
        : L.circleMarker([s.lat, s.lon], {radius: !ok ? 7 : 8 + (UNITS[CM] === ' cm' ? Math.min(7, v / 3) : 0), color: '#fff', weight: 1.5, fillColor: mcol(s), fillOpacity: .92});
      LAY.addLayer(mk.bindTooltip(`${s.name}: ${txt}`).on('click', () => open(s.id)));
    });
    if (fit && CUR.length) MAP.fitBounds(CUR.map(s => [s.lat, s.lon]), {padding: [30, 30], maxZoom: 9});
  });
}

function setView(map) {

  stopPlay();
  $('#vc').setAttribute('aria-pressed', !map);
  $('#vm').setAttribute('aria-pressed', map);
  $('#lista').hidden = map;
  $('#mapa').hidden = !map;
  $('#mleg').hidden = !map;
  $('#cm').hidden = !map;
  $('#mt').hidden = !map;
  drawMap();
  hashSave();
}

function pressDays() {
  const agg = CM === 'p7' || CM === 'f5';
  document.querySelectorAll('#days button').forEach(b => b.setAttribute('aria-pressed', !agg && +b.dataset.i === DI));
}
function setDay(i) {

  if (CM === 'p7' || CM === 'f5') { CM = 'snow'; $('#cmsel').value = 'snow'; }
  pressDays();
  const b = document.querySelector(`#days button[data-i="${i}"]`);

function stopPlay() {

}

const KEYS = ['q', 'region', 'cota', 'nieve', 'mostrar', 'orden'];
function hashSave() {
  try {
    const p = new URLSearchParams();
    KEYS.forEach(k => { if (String(st[k]) !== String(DEF[k])) p.set(k, st[k]); });
    if (VM) p.set('vista', 'mapa');
    history.replaceState(null, '', p.toString() ? '#' + p : location.pathname + location.search);
  } catch (e) {}
}
function hashLoad() {
  const p = new URLSearchParams(location.hash.slice(1));
  KEYS.forEach(k => {
    if (!p.has(k)) return;
    const el = $('#' + k);
    el.value = p.get(k);
    st[k] = k === 'cota' ? +el.value : el.value;
  });
  if (st.orden === 'cerca') { st.orden = 'region'; $('#orden').value = 'region'; }
  return p;
}
function copyLink(url, btn) {
  const t = btn.textContent;
  const done = () => { btn.textContent = '¡Enlace copiado!'; setTimeout(() => { btn.textContent = t; }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('Copia este enlace:', url));
  else prompt('Copia este enlace:', url);
}

function score(s) {
  const ix = WI.length ? WI : [7, 8], ds = ix.map(i => s.days[i]).filter(Boolean);
  if (!ds.length || ds[0].wind == null) return null;
  const avg = k => ds.reduce((t, d) => t + (d[k] || 0), 0) / ds.length;
  const nieve = Math.min(40, s.p7 * 2.5), sol = Math.min(20, avg('sun') / 8 * 20);
  const viento = 20 - Math.min(20, Math.max(0, avg('wind') - 15) * .5), frio = 20 - Math.min(20, Math.max(0, avg('tmax')) * 2);
  return {nieve, sol, viento, frio, total: Math.round(nieve + sol + viento + frio)};
}
function scBlock(s) {
  if (!s.sc) return '';
  const r = [['Nieve reciente', s.sc.nieve, 40], ['Sol', s.sc.sol, 20], ['Poco viento', s.sc.viento, 20], ['Frío', s.sc.frio, 20]];
  return `<div class="sc"><div class="scl"><span>Índice para el fin de semana</span><b>${s.sc.total}/100</b></div>` +
    r.map(([n, v, m]) => `<div class="scr"><span>${n}</span><div class="trk big"><b style="left:0;width:${Math.round(v / m * 100)}%"></b></div></div>`).join('') +
    '<p class="note">Orientativo: combina la nieve de los últimos 7 días con el sol, el poco viento y el frío previstos para el sábado y el domingo.</p></div>';
}
function camBlock(s) {
  if (!s.webcams || !s.webcams.length) return '';
  return '<div class="cams"><span>Webcams de la web oficial</span>' + s.webcams.map(c => `<a class="btn" href="${c.url}" target="_blank" rel="noopener">📷 ${c.title}</a>`).join('') + '</div>';
}
const hav = (p, s) => {
  const r = x => x * Math.PI / 180, a = Math.sin(r(s.lat - p.lat) / 2) ** 2 + Math.cos(r(p.lat)) * Math.cos(r(s.lat)) * Math.sin(r(s.lon - p.lon) / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
};
function locate(cb) {
  if (POS) return cb();
  const fail = () => {
    alert('No he podido obtener tu ubicación. Revisa el permiso del navegador.');
    st.dist = 0;
    $('#dist').value = '0';
    if (st.orden === 'cerca') { st.orden = 'region'; $('#orden').value = 'region'; }
    view();
  };
  if (!navigator.geolocation) return fail();
  navigator.geolocation.getCurrentPosition(p => {
    POS = {lat: p.coords.latitude, lon: p.coords.longitude};
    DATA.forEach(s => { s.km = hav(POS, s); });
    $('#geo').textContent = 'Ubicación activada';
    cb();
  }, fail);
}
function updCmp() {
  $('#cbar').hidden = !CMPS.length;
  $('#cn').textContent = CMPS.length + (CMPS.length === 1 ? ' estación' : ' estaciones');
  $('#cgo').disabled = CMPS.length < 2;
}
const CC = ['#1b8fe0', '#e0743a', '#2a9d6f'];
function lines(sel, key, unit) {
  const W = 640, H = 150, L = 34, R = 8, n = REFD.length, step = (W - L - R) / (n - 1);
  const vs = sel.flatMap(s => s.days.map(d => d[key] || 0));
  const hi = Math.max(1, Math.ceil(Math.max(...vs))), lo = key === 'snow' ? 0 : Math.floor(Math.min(...vs, 0));

  return '<h3 class="sec">Información</h3><table class="ct"><tbody>' + rows.map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join('') + '</tbody></table>' +
    `<div class="two">${altBlock(s, mid)}${scBlock(s)}</div>` +
    `<p class="note">Temperatura y nieve calculadas con el modelo meteorológico Open-Meteo. En la pestaña Previsión puedes ver la base, la media (${mid} m) y la cima.</p>` +
    (s.web ? `<a class="go" href="${s.web}" target="_blank" rel="noopener">Web oficial de la estación</a>` : '');
}

function paint() {
  const s = DATA.find(x => x.id === ID);
  if (!s) return;
  if (s.detail) loadJSON(`data/s/${s.id}.json`, DET, s.id, () => { if (ID === s.id && $('#det').open) paint(); });
  if (TAB === 'his' || TAB === 'prev') loadJSON(`history/${s.id}.json`, HIS, s.id, () => { if (ID === s.id && TAB === 'his' && $('#det').open) paint(); });
  const sub = (s.region === PAIS[s.country] ? s.region : s.region + ', ' + PAIS[s.country]) + (s.km != null ? ', a ' + Math.round(s.km) + ' km en línea recta' : '');
  const head = `<div class="dh"><div><h2>${s.name}</h2><p class="sub">${sub}</p></div>` +
    '<div class="acts"><button class="btn" type="button" data-dir="-1" aria-label="Estación anterior">‹</button><button class="btn" type="button" data-dir="1" aria-label="Estación siguiente">›</button><button class="btn" type="button" data-share>Compartir</button><button class="btn x" type="button">Cerrar</button></div></div>';
  const tabs = `<div class="tabs" role="tablist">${TABS.map(([k, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${TAB === k}">${n}${k === 'cam' && s.webcams && s.webcams.length ? ' (' + s.webcams.length + ')' : ''}</button>`).join('')}</div>`;
  const pan = !s.ok ? '<p class="nodata">Sin datos hoy para esta estación.</p>' : TAB === 'cam' ? panCam(s) : TAB === 'his' ? panHis(s) : TAB === 'info' ? panInfo(s) : panPrev(s);
  $('#det .in').innerHTML = head + tabs + `<div class="pan">${pan}</div>`;
}

function open(id) {
  ID = id;
  paint();
  const d = $('#det');
  if (!d.open) d.showModal();
  d.querySelector('.x').focus();
}

function go(dir) {
  const i = CUR.findIndex(s => s.id === ID);
  if (i >= 0 && CUR.length > 1) open(CUR[(i + dir + CUR.length) % CUR.length].id);
}

function reset() {
  st = {...DEF};
  for (const k in st) $('#' + k).value = st[k];
  view();
}

['q', 'region', 'cota', 'nieve', 'mostrar', 'orden', 'dist'].forEach(id =>
  $('#' + id).addEventListener(id === 'q' ? 'input' : 'change', e => {
    st[id] = id === 'cota' || id === 'dist' ? +e.target.value : e.target.value;
    if ((id === 'dist' && st.dist) || (id === 'orden' && st.orden === 'cerca')) locate(view);
    else view();
  }));
$('#reset').addEventListener('click', reset);
$('#lista').addEventListener('click', e => {
  if (e.target.closest('[data-reset]')) return reset();
  const c = e.target.closest('.card');
  if (!c) return;
  if (e.target.closest('.cmpb')) {
    const id = c.dataset.id;
    CMPS = CMPS.includes(id) ? CMPS.filter(x => x !== id) : [...CMPS, id].slice(-3);
    updCmp();
    return render();
  }
  if (e.target.closest('.fav')) {
    const id = c.dataset.id;
    FAV.has(id) ? FAV.delete(id) : FAV.add(id);
    saveFav();
    return view();
  }
  open(c.dataset.id);
});
$('#lista').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) open(e.target.dataset.id);
});
$('#det').addEventListener('click', e => {
  if (e.target.id === 'det' || e.target.closest('.x')) return e.currentTarget.close();
  const sh = e.target.closest('[data-share]');
  if (sh) return copyLink(location.href.split('#')[0] + '#s=' + ID, sh);
  const tb = e.target.closest('[data-tab]');
  if (tb) { TAB = tb.dataset.tab; paint(); return; }
  const al = e.target.closest('[data-alt]');
  if (al) { ALT = +al.dataset.alt; paint(); return; }
  const hv = e.target.closest('[data-hv]');
  if (hv) { HV = hv.dataset.hv; paint(); return; }
  const hd = e.target.closest('[data-hd]');
  if (hd) { HD = +hd.dataset.hd; paint(); return; }
  const pb = e.target.closest('[data-past]');
  if (pb) {
    const t = e.currentTarget.querySelector('.ft');
    t.classList.toggle('hidepast');
    pb.textContent = t.classList.contains('hidepast') ? 'Ver días pasados' : 'Ocultar días pasados';
    return;
  }
  const n = e.target.closest('[data-dir]');
  if (n) go(+n.dataset.dir);
});
$('#det').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

$('#vc').addEventListener('click', () => setView(false));
$('#vm').addEventListener('click', () => setView(true));
$('#cmsel').addEventListener('change', e => { stopPlay(); CM = e.target.value; pressDays(); legend(); drawMap(false); });
$('#days').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { stopPlay(); setDay(+b.dataset.i); } });
$('#play').addEventListener('click', togglePlay);
$('#geo').addEventListener('click', () => locate(view));
$('#cgo').addEventListener('click', openCmp);
$('#cclr').addEventListener('click', () => { CMPS = []; updCmp(); render(); });
$('#cmpd').addEventListener('click', e => { if (e.target.id === 'cmpd' || e.target.closest('.x')) e.currentTarget.close(); });
$('#share').addEventListener('click', e => { hashSave(); copyLink(location.href, e.currentTarget); });

(function () {
  const hero = $('#hero');
  hero.addEventListener('pointermove', e => hero.style.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(3)));
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = $('#snow'), x = c.getContext('2d'), P = [];
  let w, h, wind = 0, push = 0;
  const size = () => { w = c.width = c.offsetWidth; h = c.height = c.offsetHeight; };
  size();
  addEventListener('resize', size);
  for (let i = 0; i < 150; i++) P.push({x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2.2 + .6, v: Math.random() * .6 + .3, p: Math.random() * 6});
  hero.addEventListener('pointermove', e => { push = (e.movementX || 0) * .06; });
  (function frame(t) {
    wind += (push - wind) * .05;
    push *= .95;
    x.clearRect(0, 0, w, h);
    x.fillStyle = '#fff';
    for (const p of P) {
      p.y += p.v + p.r * .3;
      p.x += Math.sin(t / 1500 + p.p) * .3 + wind;
      if (p.y > h) { p.y = -4; p.x = Math.random() * w; }
      if (p.x > w + 4) p.x = -4;
      if (p.x < -4) p.x = w + 4;
      x.globalAlpha = .35 + p.r / 4;
      x.beginPath();
      x.arc(p.x, p.y, p.r, 0, 6.283);
      x.fill();
    }
    requestAnimationFrame(frame);
  })(0);
})();

fetch('data/latest.json').then(r => r.json()).then(d => {
  DATA = d.stations.map(s => ({...s, ok: s.days.length > 0, t: Math.round(s.temp_now), p7: sum(s.days.slice(0, 7)), f5: sum(s.days.slice(7))}));
  MAX = Math.max(10, ...DATA.flatMap(s => s.days.map(x => x.snow || 0)));
  $('#estado').textContent = 'Actualizado el ' + new Date(d.updated).toLocaleString('es-ES', {dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Madrid'}) + '.';
  $('#region').innerHTML = '<option value="">Todos los países</option>' + Object.keys(PAIS).filter(c => DATA.some(s => s.country === c)).map(c => {
    const rs = [...new Set(DATA.filter(s => s.country === c).map(s => s.region))];
    return `<optgroup label="${PAIS[c]}"><option value="c:${c}">${PAIS[c]} entera</option>${rs.length > 1 ? rs.map(r => `<option>${r}</option>`).join('') : ''}${DATA.filter(s => s.country === c).sort((a, b) => a.name.localeCompare(b.name, 'es')).map(s => `<option value="s:${s.id}">\u00a0\u00a0${s.name}</option>`).join('')}</optgroup>`;
  }).join('');
  const ref = DATA.find(s => s.ok);
  if (ref) {
    REFD = ref.days;
    FD = REFD.length - 7;
    $('#days').innerHTML = REFD.map((d, i) => `<button type="button" data-i="${i}" aria-pressed="false" class="${i < 7 ? 'past' : i === 7 ? 'today' : ''}"><small>${i === 7 ? 'hoy' : day(d.date, {weekday: 'short'})}</small><b>${day(d.date, {day: 'numeric'})}</b></button>`).join('');
    pressDays();
    WI = REFD.map((d, i) => [i, new Date(d.date + 'T12:00:00').getDay()]).filter(([i, g]) => i >= 7 && (g === 0 || g === 6)).map(([i]) => i);
  }
  DATA.forEach(s => { s.sc = s.ok && ref ? score(s) : null; });
  const hp = hashLoad();
  stats();
  view();
  if (hp.get('vista') === 'mapa') setView(true);
  if (DATA.some(x => x.id === hp.get('s'))) open(hp.get('s'));
}).catch(() => {
  $('#estado').textContent = 'Todavía no hay datos. Ejecuta «Actualizar datos» en la pestaña Actions de GitHub.';
});
</script>
